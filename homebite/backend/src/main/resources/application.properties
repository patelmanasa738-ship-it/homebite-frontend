# ====================================================================
# HomeBite Backend Configuration
# ====================================================================

server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:homebite}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:HomeBiteSecretKeySuperSecure2026WithAtLeast256BitsOfEntropy!}
jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
