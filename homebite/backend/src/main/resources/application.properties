# ====================================================================
# HomeBite Backend Configuration - PostgreSQL
# ====================================================================

# Dynamic server port (Render assigns $PORT, fallback to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homebite}}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:HomeBiteSecretKeySuperSecure2026WithAtLeast256BitsOfEntropy!}
jwt.expiration-ms=86400000

# CORS Configuration
# Includes localhost development and deployed Vercel frontend
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://homebite-frontend-5hqd-fiur6tlro-manasa-808d.vercel.app}
